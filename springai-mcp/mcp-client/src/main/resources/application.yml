spring:
  application:
    name: spring-ai-mcp-client
  profiles:
    active: dev
  ai:
    openai:
      api-key: ${API_KEY}
      base-url: ${BASE_URL}
      chat:
        completions-path: ${COMPLETIONS_PATH}
        options:
          model: ${MODEL}
    mcp:
      client:
        enabled: true
        name: spring-ai-mcp-client-sse
        type: ASYNC
        sse:
          connections:
            my-mcp-server:
              url: http://localhost:9060
              sse-endpoint: /sse

# 火山引擎TTS配置
volcano:
  tts:
    access-key: ${VOLCANO_ACCESS_KEY:}
    secret-key: ${VOLCANO_SECRET_KEY:}
    region: ${VOLCANO_REGION:cn-north-1}
    service: ${VOLCANO_SERVICE:tts}
    host: ${VOLCANO_HOST:open.volcengineapi.com}
    model: ${VOLCANO_MODEL:douyin-tts-pro}
    voice: ${VOLCANO_VOICE:zh_female_qingxin}
    use-websocket: ${VOLCANO_USE_WEBSOCKET:false}
