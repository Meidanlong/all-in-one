server:
  port: 8080
  servlet:
    context-path: /

# 日志配置
logging:
  level:
    com.mdl.digitalhuman: DEBUG
    org.springframework.web: INFO
    org.java_websocket: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Spring配置
spring:
  application:
    name: digital-human
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 自定义配置
digital-human:
  coze:
    websocket-url: wss://loop.coze.cn/open/api/v1/websocket
    auth-token: YOUR_COZE_API_TOKEN
  tencent:
    websocket-url: wss://gw.tvs.qq.com/v2/ws/ivh/interactdriver/interactdriverservice/commandchannel
    auth-token: YOUR_TENCENT_API_TOKEN
    character-id: YOUR_TENCENT_CHARACTER_ID

